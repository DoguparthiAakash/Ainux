set timeout=5
set default=0

if [ "${grub_platform}" == "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi
insmod video_bochs
insmod video_cirrus
insmod gfxterm
set gfxmode=1024x768x32,1024x768x24,800x600x32,800x600x16,640x480x32,auto
terminal_output gfxterm

menuentry "Mithl OS (Desktop GUI - Auto 64-bit / 32-bit)" {
    set gfxpayload=1024x768x32,1024x768x24,800x600x32,800x600x16,640x480x32,auto
    multiboot /boot/ainux_kernel mode=desktop
    boot
}

menuentry "Mithl OS (Terminal Shell - Auto Detect)" {
    set gfxpayload=1024x768x32,1024x768x24,800x600x32,800x600x16,640x480x32,auto
    multiboot /boot/ainux_kernel mode=shell
    boot
}

menuentry "Mithl OS (Limbo PC Emulator / Safe 800x600)" {
    set gfxpayload=800x600x32,800x600x16,640x480x32,auto
    multiboot /boot/ainux_kernel mode=desktop safe_video limbo
    boot
}

menuentry "Mithl OS (Limbo 32-bit / CPU Architecture Diagnostics)" {
    set gfxpayload=text
    multiboot /boot/ainux_kernel mode=shell arch_diag
    boot
}

menuentry "Mithl OS (Safe Graphics / VESA Fallback)" {
    set gfxpayload=text
    multiboot /boot/ainux_kernel mode=shell safe_video
    boot
}

menuentry "Mithl OS (Serial Debug / Text Mode)" {
    set gfxpayload=text
    multiboot /boot/ainux_kernel mode=shell debug
    boot
}
