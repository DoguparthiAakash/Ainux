set timeout=3
set default=0

insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm

menuentry "Ainux Kernel" {
    set gfxpayload=1024x768x32,1024x768x24,800x600x32,auto
    multiboot /boot/ainux_kernel
    boot
}

menuentry "Ainux Kernel (Serial Debug)" {
    set gfxpayload=text
    multiboot /boot/ainux_kernel
    boot
}
