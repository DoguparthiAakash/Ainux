set timeout=3
set default=0

if [ "${grub_platform}" == "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi
insmod video_bochs
insmod video_cirrus
insmod gfxterm
set gfxmode=1024x768x32,1024x768x24,800x600x32,auto
terminal_output gfxterm
menuentry "Ainux Kernel" {
    set gfxpayload=1024x768x32,1024x768x24,800x600x32,auto
    multiboot /boot/ainux_kernel
    boot
}

menuentry "Ainux Kernel (Serial Debug)" {
    set gfxpayload=text
    multiboot /boot/ainux_kernel
    boot
}
