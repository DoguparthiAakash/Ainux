set timeout=1
set default=0

# Load video modules
insmod all_video

if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
fi

insmod font
insmod gfxterm

# Load font for gfxterm
set gfxmode=auto
set gfxpayload=keep

if loadfont /boot/grub/fonts/unicode.pf2; then
    terminal_output gfxterm
fi

# Serial for debugging
serial --unit=0 --speed=115200
terminal_input serial

menuentry "Ainuix" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.tar "initrd"
}
