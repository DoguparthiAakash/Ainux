set timeout=5
set default=0

if [ "${grub_platform}" == "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi
insmod video_bochs
insmod video_cirrus
insmod gfxterm
set gfxmode=1024x768x32,1024x768x24,800x600x32,auto
terminal_output gfxterm

menuentry "Mithl OS (Desktop GUI)" {
    set gfxpayload=1024x768x32,1024x768x24,800x600x32,auto
    multiboot /boot/ainux_kernel mode=desktop
    boot
}

menuentry "Mithl OS (Terminal Shell)" {
    set gfxpayload=1024x768x32,1024x768x24,800x600x32,auto
    multiboot /boot/ainux_kernel mode=shell
    boot
}

menuentry "Mithl OS (Serial Debug / Text Mode)" {
    set gfxpayload=text
    multiboot /boot/ainux_kernel mode=shell debug
    boot
}
